<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tip Advisor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <h1>AI Tip Advisor 🤖</h1>
            <p>Let AI analyze your engagement and suggest a fair tip for this project.</p>
        </header>
        <main>
            <button id="analyzeBtn">Analyze My Engagement</button>
            <div id="results" class="hidden">
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p>Analyzing your likes, comments, and remixes...</p>
                </div>
                <div id="suggestion">
                    <h2>AI Suggestion:</h2>
                    <p id="reasoning"></p>
                    <div class="tip-amount">
                        <p>Suggested Tip: <span id="amount"></span> Credits</p>
                    </div>
                </div>
            </div>
             <div id="error" class="hidden">
                <p>Could not analyze engagement. Are you logged in?</p>
            </div>
        </main>
    </div>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
